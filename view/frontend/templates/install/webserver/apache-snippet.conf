# Trusteed AgenticCommerce — Apache snippet for /.well-known/mcp.json
# Add this inside your <VirtualHost> or .htaccess (if AllowOverride is enabled).
# Place BEFORE the generic Magento rewrite rules.
#
# Verify with: bin/magento trusteed:check-webserver

RewriteEngine On
RewriteRule ^\.well-known/mcp\.json$ /index.php [L,QSA]
