# Trusteed AgenticCommerce — Nginx snippet for /.well-known/mcp.json
# Add this inside your server {} block.
# Required for Magento to handle the well-known path since Nginx normally
# serves static files before PHP; this rule forces the path through Magento.
#
# Verify with: bin/magento trusteed:check-webserver

location /.well-known/mcp.json {
    try_files $uri /index.php?$args;
}
